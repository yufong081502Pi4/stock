hr,.nav{border-color:#2e2b24}

<script>
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('xiaohe_theme',t);}catch(e){}
  document.querySelectorAll('.theme-bar button').forEach(function(b){
    b.classList.toggle('on', b.dataset.th===t);
  });
}
(function(){
  var t='sunny';
  try{ t=localStorage.getItem('xiaohe_theme')||'sunny'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('.theme-bar button').forEach(function(b){
      b.classList.toggle('on', b.dataset.th===t);
    });
  });
})();
</script>
